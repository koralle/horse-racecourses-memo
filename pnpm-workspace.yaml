# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
supportedArchitectures:
  cpu:
    - current
    - wasm32
allowBuilds: # pnpm 11
  esbuild: false
  sharp: false
  workerd: true
ignoredBuiltDependencies: # pnpm 10
  - esbuild
  - sharp

# Every version the site builds against lives here, pinned exactly. package.json
# only says `catalog:`, so a version change is one line in this file.
# `catalogMode: strict` keeps new dependencies from skipping the catalog, and
# `saveExact` keeps `pnpm add` from writing a range.
catalogMode: strict
saveExact: true
catalog:
  "@astrojs/check": 0.9.12
  "@astrojs/compiler-rs": 0.5.2
  "@astrojs/cloudflare": 14.3.4
  "@astrojs/language-server": 2.16.13
  "@cloudflare/nimbus-docs": 0.19.0
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@iconify-json/ph": 1.2.2
  "@resvg/resvg-js": 2.6.2
  "@tailwindcss/vite": 4.3.3
  astro: 7.4.2
  clsx: 2.1.1
  oxfmt: 0.74.0
  pagefind: 1.5.2
  satori: 0.26.0
  sharp: 0.35.5
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: 5.9.3
  wrangler: 4.152.0
